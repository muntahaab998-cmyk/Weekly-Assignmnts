<!DOCTYPE html>
<html>
<head>
    <title>Week 5 Assignment</title>
</head>

<body>

<h3>Click on the password to show or hide password:</h3>

<label>Password:</label>
<input type="password" id="password" onclick="showPassword()">

<script>
function showPassword() {
    var passwordBox = document.getElementById("password");

    if (passwordBox.type == "password") {
        passwordBox.type = "text";
        passwordBox.style.backgroundColor = "lightgreen";
    } else {
        passwordBox.type = "password";
        passwordBox.style.backgroundColor = "white";
    }
}
</script>

</body>
</html>
