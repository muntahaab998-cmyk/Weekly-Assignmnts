<!DOCTYPE html>
<html>
<head>
    <title>Romantic Movies</title>

    <link rel="stylesheet" href="style.css">

    <style>
        h1 {
            text-align: center;
        }

        table {
            width: 50%;
            margin: auto;
            border-top: thick dotted purple;
            border-bottom: medium dashed green;
            border-spacing: 10px;
        }

        th, td {
            text-align: center;
            border: thick solid blue;
            padding: 10px;
        }
    </style>
</head>

<body>

<h1>Romantic Movies</h1>

<table>

    <tr>
        <th class="movie">Movie</th>
        <th class="year">Year</th>
        <th class="actress">Actress</th>
        <th class="actor">Actor</th>
    </tr>

    <tr>
        <td>Titanic</td>
        <td>1997</td>
        <td>Kate Winslet</td>
        <td>Leonardo DiCaprio</td>
    </tr>

    <tr>
        <td>The Notebook</td>
        <td>2004</td>
        <td>Rachel McAdams</td>
        <td>Ryan Gosling</td>
    </tr>

    <tr>
        <td>La La Land</td>
        <td>2016</td>
        <td>Emma Stone</td>
        <td>Ryan Gosling</td>
    </tr>

    <tr>
        <td>Me Before You</td>
        <td>2016</td>
        <td>Emilia Clarke</td>
        <td>Sam Claflin</td>
    </tr>

    <tr>
        <td>Crazy Rich Asians</td>
        <td>2018</td>
        <td>Constance Wu</td>
        <td>Henry Golding</td>
    </tr>

</table>

</body>
</html>
